name: Desktop builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting, types and lint
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build Electron bundles
        run: npm run build

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: npm run dist:win
          - platform: Linux AppImage
            os: ubuntu-latest
            command: npm run dist:appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: ${{ matrix.command }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tuiu-nany-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
