<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/public/icon.ico" type="image/x-icon" />
    <title>As Aventuras de Tuiu e Nany</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #151a22;
        cursor:
          url('/public/cursor.png') 0 0,
          auto;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor:
          url('/public/cursor.png') 0 0,
          auto;
      }
      #game-container canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor:
          url('/public/cursor.png') 0 0,
          auto !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/game/index.ts"></script>
  </body>
</html>
