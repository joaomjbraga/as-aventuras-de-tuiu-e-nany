<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>As Aventuras de Tuiu e Nany</title>
    <meta
      name="description"
      content="Jogo 2D em pixel art sobre um casal que enfrenta zumbis em co-op local. Jogue no navegador ou baixe as versões portáteis para Windows e Linux."
    />
    <meta name="theme-color" content="#11151d" />
    <meta property="og:title" content="As Aventuras de Tuiu e Nany" />
    <meta
      property="og:description"
      content="Feito para celebrar cinco anos juntos: uma aventura 2D em pixel art, cooperativa local e controlada pelo teclado."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8'%3E%3Cpath fill='%23ff4d5d' d='M3 0h1v1H3zM5 0h1v1H5zM2 1h1v1H2zM4 1h1v1H4zM6 1h1v1H6zM2 2h5v1H2zM1 3h7v1H1zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true">
      <video
        class="background__video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="assets/gameplay-poster.jpg"
      >
        <source src="assets/as-Aventuras-de-Tuiu-e-Nany.webm" type="video/webm" />
      </video>
    </div>

    <main class="hero">
      <section class="hero__texto" aria-labelledby="titulo">
        <h1 class="hero__titulo" id="titulo">
          <span class="hero__nome hero__nome--tuiu">Tuiu</span>
          <span class="hero__elo" aria-hidden="true">&amp;</span>
          <span class="hero__nome hero__nome--nany">Nany</span>
        </h1>

        <p class="hero__frase"><strong>O fim do mundo.</strong></p>
        <p class="hero__descricao">
          Feito para celebrar cinco anos juntos: Tuiu e Nany enfrentam zumbis em dupla, no mesmo teclado.
        </p>

        <a class="cta" href="https://tuienany.netlify.app">
          <span>Jogar no navegador</span>
          <small>sem instalar</small>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 13 13 3M5 3h8v8" />
          </svg>
        </a>
        <p class="hero__nota">Jogo controlado por teclado; não há controles touch.</p>

        <div class="downloads">
          <p class="downloads__titulo">Versões para jogar offline</p>
          <div class="downloads__lista">
            <a
              class="download"
              href="https://github.com/joaomjbraga/as-aventuras-de-tuiu-e-nany/releases/latest/download/as-aventuras-de-tuiu-e-nany-windows.exe"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Baixar As Aventuras de Tuiu e Nany para Windows"
            >
              <img src="assets/logo-windows.png" alt="" />
              <span><strong>Windows</strong><small>.exe portátil</small></span>
            </a>
            <a
              class="download"
              href="https://github.com/joaomjbraga/as-aventuras-de-tuiu-e-nany/releases/latest/download/as-aventuras-de-tuiu-e-nany-linux.AppImage"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Baixar As Aventuras de Tuiu e Nany para Linux"
            >
              <img src="assets/linux-512.png" alt="" />
              <span><strong>Linux</strong><small>AppImage portátil</small></span>
            </a>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
