<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>As Aventuras de Tuiu e Nany</title>
    <meta
      name="description"
      content="Jogo desktop 2D em pixel art, co-op local para duas pessoas no mesmo teclado. Tuiu e Nany enfrentam zumbis em quatro cenários que contam a história de um casal."
    />
    <meta name="theme-color" content="#151a22" />
    <meta property="og:title" content="As Aventuras de Tuiu e Nany" />
    <meta
      property="og:description"
      content="Jogo desktop 2D em pixel art, co-op local para duas pessoas no mesmo teclado. Tuiu e Nany enfrentam zumbis em quatro cenários que contam a história de um casal."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8'%3E%3Cpath fill='%23ff4d5d' d='M3 0h1v1H3zM5 0h1v1H5zM2 1h1v1H2zM4 1h1v1H4zM6 1h1v1H6zM2 2h5v1H2zM1 3h7v1H1zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      Página única: a tela inteira é o trailer rodando ao fundo.

      O vídeo é um arquivo local em WebM (VP9). O arquivo tem track
      de áudio, mas `muted` o silencia na página. Três atributos não
      são decoração, são requisito de autoplay em navegador: muted,
      playsinline e o próprio autoplay. Sem muted, o Chrome e o Safari
      bloqueiam a reprodução automática e a página abre com um
      retângulo preto.

      Não há atributo controls: o vídeo é cenário, não conteúdo.
      Para quem usa teclado ou leitor de tela, um vídeo sem controls
      e sem tabindex não entra na ordem de tabulação e não é
      anunciado.
    -->
    <main class="cena">
      <video
        class="cena__video"
        data-video
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
        tabindex="-1"
      >
        <source src="assets/as-Aventuras-de-Tuiu-e-Nany.webm" type="video/webm" />
      </video>

      <!-- Dither, scanlines e vinheta: o filtro que amarra o vídeo à identidade do jogo. -->
      <div class="cena__pixels" aria-hidden="true"></div>
      <div class="cena__vinheta" aria-hidden="true"></div>

      <div class="cena__painel">
        <p class="cena__pre">as aventuras de</p>

        <!--
          Cada nome usa a cor que o próprio jogo dá ao jogador no HUD
          (TEXT.p1 e TEXT.p2 em src/game/theme.ts).
        -->
        <h1 class="cena__titulo">
          <span class="cena__nome cena__nome--tuiu">Tuiu</span>
          <span class="cena__nome cena__nome--nany">Nany</span>
        </h1>

        <!-- Os três corações de pixel art do jogo, desenhados na mesma grade 9x8. -->
        <svg
          class="cena__coracoes"
          viewBox="0 0 33 8"
          width="99"
          height="24"
          role="img"
          aria-label="Três corações: os três pontos de vida de cada personagem"
        >
          <defs>
            <g id="coracao" fill="currentColor">
              <path
                d="M3 0h1v1H3zM5 0h1v1H5zM2 1h1v1H2zM4 1h1v1H4zM6 1h1v1H6zM2 2h5v1H2zM1 3h7v1H1zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z"
              />
            </g>
          </defs>
          <use href="#coracao" />
          <use href="#coracao" x="12" />
          <use href="#coracao" x="24" />
        </svg>

        <p class="cena__linha" aria-hidden="true"></p>

        <p class="cena__rotulo">baixar o jogo</p>

        <!--
          Cada botão baixa o artefato direto, sem passar pela página de
          releases. `releases/latest` faz o GitHub resolver sozinho qual é a
          versão mais recente, então estas URLs não precisam ser tocadas a
          cada release — desde que o nome do arquivo continue igual, o que é
          garantido pelo `artifactName` sem ${version} no electron-builder.json5.

          Uma consequência do `latest`: pré-lançamento não conta. O release.yml
          marca versão com sufixo (0.1.0-beta.1) como prerelease, e o GitHub
          pula essas, então um beta não chega por este link.

          O target="_blank" continua valendo: se der 404, a aba do GitHub abre
          por cima e a vitrine segue intacta atrás.
        -->
        <div class="cena__acoes">
          <a
            class="botao"
            href="https://github.com/joaomjbraga/as-aventuras-de-tuiu-e-nany/releases/latest/download/as-aventuras-de-tuiu-e-nany-windows.exe"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="botao__logo botao__logo--windows" aria-hidden="true"></span>
            windows
          </a>
          <a
            class="botao"
            href="https://github.com/joaomjbraga/as-aventuras-de-tuiu-e-nany/releases/latest/download/as-aventuras-de-tuiu-e-nany-linux.AppImage"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="botao__logo botao__logo--linux" aria-hidden="true"></span>
            linux
          </a>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
